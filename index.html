    <!-- JSON-LD Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "¿Es terapia psicológica?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Es orientación y acompañamiento psicológico por chat con un psicólogo colegiado: escucha, contención emocional, pautas prácticas y seguimiento a tu ritmo. No reemplaza un tratamiento clínico ni atiende emergencias."
          }
        },
        {
          "@type": "Question",
          "name": "¿Mi psicólogo es una persona real y está colegiado?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí. Es una persona real, nunca un bot, y siempre es la misma. Verificamos su colegiatura y habilitación en el registro del Colegio de Psicólogos del Perú (CPsP)."
          }
        },
        {
          "@type": "Question",
          "name": "¿Quién ve lo que escribo o grabo?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Solo tú y tu psicólogo. Tus chats van cifrados de extremo a extremo por WhatsApp, no tomamos capturas y guardamos solo los datos mínimos para coordinar tu servicio. Si tu empresa contrata el beneficio, nunca ve tus conversaciones."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué pasa si estoy en crisis?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Mente en Línea no es un servicio de emergencias. Si estás en peligro o piensas en hacerte daño, llama gratis a la Línea 113 (salud mental) o acude al centro de salud más cercano. Si al evaluar tu caso detectamos riesgo, tu psicólogo te orienta a una sesión en vivo o a esas líneas."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cómo pago?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Por Yape, Plin o transferencia, por adelantado, antes de activar tu chat. Puedes cancelar cuando quieras; tu servicio sigue hasta el final del periodo pagado."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué pasa si no me gusta?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Si en tu primera semana no estás conforme, te devolvemos tu dinero por el mismo medio de pago."
          }
        },
        {
          "@type": "Question",
          "name": "¿Y si no me responden en 24 horas?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Si no te respondemos en 24 horas (de lunes a sábado), te regalamos un día de servicio."
          }
        },
        {
          "@type": "Question",
          "name": "¿Atienden a menores de 18 años?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. El servicio es solo para mayores de 18 años."
          }
        },
        {
          "@type": "Question",
          "name": "Si mi empresa lo contrata, ¿puede leer mis mensajes?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Recursos Humanos solo recibe reportes agregados de grupos de al menos 10 personas, sin nombres, chats ni diagnósticos."
          }
        }
      ]
    }
