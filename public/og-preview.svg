<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Fondo cálido crema/arena -->
  <rect width="1200" height="630" fill="#F7F1E8"/>
  <circle cx="200" cy="150" r="340" fill="#DCE9DD" opacity="0.7" filter="blur(60px)"/>
  <circle cx="1020" cy="480" r="380" fill="#E8DFD3" opacity="0.8" filter="blur(70px)"/>
  <circle cx="600" cy="560" r="300" fill="#DCE9DD" opacity="0.5" filter="blur(50px)"/>
  
  <g transform="translate(120, 140)">
    <!-- Badge superior -->
    <rect width="240" height="40" rx="20" fill="#DCE9DD" />
    <text x="24" y="25" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#1F4D3A">
      📍 Disponible en todo el Perú
    </text>

    <!-- Brand Header -->
    <g transform="translate(0, 65)">
      <rect width="64" height="64" rx="20" fill="#1F4D3A"/>
      <!-- Cerebro protegido blanco -->
      <path d="M32 16 C24 10, 12 18, 14 30 C6 36, 9 50, 19 53 C21 60, 31 63, 39 60 C46 63, 57 60, 60 51 C69 47, 70 33, 61 26 C62 14, 49 8, 39 14 Z" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" transform="scale(0.8) translate(8, 6)"/>
      <text x="82" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="36" font-weight="800" fill="#1F4D3A" letter-spacing="-1">Mente en Línea</text>
    </g>
    
    <!-- Headline -->
    <text x="0" y="210" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="64" font-weight="800" fill="#1E2A24" letter-spacing="-2">
      Habla, desahógate, <tspan fill="#5E7F63">cuídate.</tspan>
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="275" font-family="'Inter', system-ui, sans-serif" font-size="24" fill="#5B6B62" font-weight="500">
      Acompañamiento psicológico por WhatsApp con tu psicólogo colegiado (CPsP).
    </text>
    <text x="0" y="315" font-family="'Inter', system-ui, sans-serif" font-size="24" fill="#5B6B62" font-weight="500">
      Sin cámara, sin citas fijas y a tu propio ritmo. Te respondemos en máx. 24 horas.
    </text>
    
    <!-- Badges -->
    <g transform="translate(0, 360)">
      <rect width="210" height="48" rx="24" fill="#1F4D3A" />
      <text x="24" y="30" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">
        Desde S/ 89 al mes
      </text>

      <rect x="225" width="260" height="48" rx="24" fill="#FFFFFF" stroke="#5E7F63" stroke-width="2" stroke-opacity="0.3" />
      <text x="245" y="30" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="17" font-weight="600" fill="#1F4D3A">
        ✓ Garantía primera semana
      </text>
    </g>
  </g>
</svg>