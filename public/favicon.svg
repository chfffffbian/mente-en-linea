  <!-- Borde fino translúcido -->
  <rect x="1" y="1" width="98" height="98" rx="25" stroke="#5E7F63" stroke-width="2" stroke-opacity="0.25" />
  
  <!-- Cerebro protegido por la mano (Isotipo Mente en Línea) -->
  <g transform="translate(14, 12) scale(0.72)" stroke="#5E7F63" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Contornos del cerebro -->
    <path d="M42 22 C30 14, 14 26, 16 42 C6 50, 10 70, 24 74 C26 84, 40 88, 52 84 C62 88, 78 84, 82 72 C94 66, 96 46, 84 36 C86 20, 68 12, 54 20 C48 16, 46 18, 42 22 Z" />
    
    <!-- Circunvoluciones cerebrales interiores -->
    <path d="M38 34 C36 44, 48 46, 52 38 C56 30, 48 24, 42 28" />
    <path d="M62 36 C64 48, 76 46, 74 34" />
    <path d="M30 52 C38 52, 44 60, 42 68" />
    
    <!-- Mano protectora y cálida que sostiene la mente -->
    <path d="M22 84 C38 88, 62 82, 78 68 C84 62, 88 54, 86 46 C76 56, 60 64, 42 66 C32 68, 26 76, 22 84 Z" fill="#DCE9DD" fill-opacity="0.6" />
